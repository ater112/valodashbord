<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>발로란트 디스코드 대시보드</title>
  <link rel="stylesheet" href="style.css">
  <!-- Axios & Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>발로란트 리더보드</h1>
      
      <!-- 로그인 전/후 상태가 표시될 영역 -->
      <div id="profile-section">
        <button id="login-btn" onclick="loginWithDiscord()">디스코드 계정으로 로그인</button>
        
        <div id="user-info" class="hidden">
          <img id="user-avatar" src="" alt="Profile" />
          <h2 id="user-name"></h2>
          
          <div class="riot-form">
            <input type="text" id="riot-id" placeholder="Riot ID (예: 닉네임)">
            <input type="text" id="tag-line" placeholder="Tag (# 제외)">
            <button onclick="saveRiotId()">계정 연동</button>
          </div>
        </div>
      </div>
    </header>

    <main>
      <h2>서버 전체 리더보드</h2>
      <div class="chart-container">
        <canvas id="leaderboardChart"></canvas>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
